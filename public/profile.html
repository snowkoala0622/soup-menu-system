<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人資料 — 補湯菜單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F0E5;
    --paper-deep: #EAE2D0;
    --ink: #2B2620;
    --ink-soft: #6B6255;
    --herb: #4F6353;
    --herb-deep: #384A3C;
    --seal: #A63D2F;
    --border: #DDD2BC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(79,99,83,0.06) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(166,61,47,0.05) 0, transparent 40%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #FFFDF8;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px 30px 30px;
  }

  .back-link {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-decoration: none;
    margin-bottom: 18px;
  }
  .back-link:hover { color: var(--herb-deep); }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--herb);
    font-weight: 500;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 24px;
    margin: 0 0 4px;
    letter-spacing: 0.05em;
  }
  .sub {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }

  .not-logged-in {
    text-align: center;
    padding: 40px 10px;
    color: var(--ink-soft);
  }
  .not-logged-in a { color: var(--herb-deep); font-weight: 700; }

  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--herb-deep);
    margin: 26px 0 14px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .section-title:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }

  form { display: flex; flex-direction: column; gap: 14px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  label {
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--herb-deep);
    font-weight: 700;
  }
  input {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus {
    outline: 2px solid var(--herb);
    outline-offset: 1px;
  }
  input:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .current-email {
    font-size: 13.5px;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 9px 12px;
  }
  .current-email strong { color: var(--ink); font-weight: 700; }

  .pending-note {
    font-size: 12.5px;
    color: var(--herb-deep);
    background: rgba(79,99,83,0.08);
    border: 1px solid rgba(79,99,83,0.25);
    border-radius: 5px;
    padding: 9px 12px;
    line-height: 1.5;
  }

  .resend-link {
    align-self: flex-start;
    font-size: 12px;
    color: var(--herb-deep);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .resend-link:disabled { opacity: 0.5; cursor: not-allowed; text-decoration: none; }

  .cancel-link {
    align-self: flex-start;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  .submit-btn {
    margin-top: 4px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 0;
    border: none;
    border-radius: 5px;
    background: var(--herb);
    color: #F5F0E5;
    cursor: pointer;
  }
  .submit-btn:hover { background: var(--herb-deep); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg {
    font-size: 12.5px;
    padding: 9px 12px;
    border-radius: 5px;
    display: none;
    line-height: 1.5;
  }
  .msg.show { display: block; }
  .msg.error {
    background: rgba(166,61,47,0.08);
    color: var(--seal);
    border: 1px solid rgba(166,61,47,0.25);
  }
  .msg.success {
    background: rgba(79,99,83,0.1);
    color: var(--herb-deep);
    border: 1px solid rgba(79,99,83,0.25);
  }
</style>
</head>
<body>

<div class="card">
  <a href="/index.html" class="back-link">← 返回菜單</a>
  <h1>個人資料</h1>
  <div class="sub" id="page-sub"></div>

  <div id="content"></div>
</div>

<script>
let currentToken = localStorage.getItem('token');

function renderNotLoggedIn() {
  document.getElementById('content').innerHTML = `
    <div class="not-logged-in">
      尚未登入,<a href="/login.html">前往會員登入</a>
    </div>
  `;
}

function renderForms(member) {

  document.getElementById('content').innerHTML = `
    <div class="section-title">基本資料</div>
    <div class="msg" id="profile-msg"></div>
    <form id="profile-form">
      <div class="field">
        <label>姓名</label>
        <input type="text" id="profile-name" placeholder="您的稱呼" value="${member.name ? escapeAttr(member.name) : ''}">
      </div>
      <div class="field">
        <label>手機號碼</label>
        <input type="tel" id="profile-phone" placeholder="0912345678" value="${escapeAttr(member.phone)}" required>
      </div>
      <button type="submit" class="submit-btn" id="profile-btn">儲存變更</button>
    </form>

    <div class="section-title">修改 Email</div>
    <div class="msg" id="email-msg"></div>
    <div id="email-section"></div>
  `;

  document.getElementById('profile-form').addEventListener('submit', handleProfileSubmit);
  renderEmailSection(member);
}

// 依照目前是否有待驗證的新信箱(member.pending_email),顯示「輸入新信箱」或「輸入驗證碼」畫面
function renderEmailSection(member) {
  const section = document.getElementById('email-section');

  if (member.pending_email) {
    section.innerHTML = `
      <div class="pending-note">
        驗證碼已寄到 <strong>${escapeAttr(member.pending_email)}</strong>,請輸入收到的 6 碼驗證碼完成變更。
      </div>
      <form id="email-verify-form">
        <div class="field">
          <label>驗證碼</label>
          <input type="text" id="email-code" placeholder="6 位數驗證碼" inputmode="numeric" maxlength="6" required>
        </div>
        <button type="submit" class="submit-btn" id="email-verify-btn">確認變更</button>
      </form>
      <button type="button" class="resend-link" id="email-resend-btn">重新寄送驗證碼</button>
      <button type="button" class="cancel-link" id="email-cancel-btn">取消,重新輸入信箱</button>
    `;
    document.getElementById('email-verify-form').addEventListener('submit', handleEmailVerifySubmit);
    document.getElementById('email-resend-btn').addEventListener('click', handleEmailResend);
    document.getElementById('email-cancel-btn').addEventListener('click', () => {
      member.pending_email = null;
      renderEmailSection(member);
      hideMsg('email-msg');
    });
  } else {
    section.innerHTML = `
      <div class="current-email"><strong>${member.email ? escapeAttr(member.email) : '尚未設定'}</strong></div>
      <form id="email-request-form">
        <div class="field">
          <label>新的 Email</label>
          <input type="email" id="new-email" placeholder="your@gmail.com" required>
        </div>
        <button type="submit" class="submit-btn" id="email-request-btn">送出並寄送驗證碼</button>
      </form>
    `;
    document.getElementById('email-request-form').addEventListener('submit', (e) => handleEmailRequestSubmit(e, member));
  }
}

function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;');
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `msg show ${type}`;
}
function hideMsg(id) {
  document.getElementById(id).className = 'msg';
}

async function handleProfileSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('profile-btn');
  btn.disabled = true;
  hideMsg('profile-msg');

  const name = document.getElementById('profile-name').value;
  const phone = document.getElementById('profile-phone').value;

  try {
    const res = await fetch('/api/members/me', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentToken}`
      },
      body: JSON.stringify({ name, phone })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg('profile-msg', data.error || '更新失敗', 'error');
      return;
    }

    // 電話號碼改了,token跟著換新,順便更新localStorage裡存的會員資料
    currentToken = data.token;
    localStorage.setItem('token', data.token);
    localStorage.setItem('member', JSON.stringify(data.member));

    showMsg('profile-msg', '個人資料已更新', 'success');
  } catch {
    showMsg('profile-msg', '連線失敗,請確認伺服器是否正常運作', 'error');
  } finally {
    btn.disabled = false;
  }
}

// 第一步:送出新信箱,後端會寄驗證碼到新信箱並記住 pending_email
async function handleEmailRequestSubmit(e, member) {
  e.preventDefault();
  const btn = document.getElementById('email-request-btn');
  btn.disabled = true;
  hideMsg('email-msg');

  const new_email = document.getElementById('new-email').value;

  try {
    const res = await fetch('/api/members/me/email', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentToken}`
      },
      body: JSON.stringify({ new_email })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg('email-msg', data.error || '申請失敗', 'error');
      return;
    }

    member.pending_email = data.pending_email;
    renderEmailSection(member);
    showMsg('email-msg', data.message, data.email_sent ? 'success' : 'error');
  } catch {
    showMsg('email-msg', '連線失敗,請確認伺服器是否正常運作', 'error');
  } finally {
    btn.disabled = false;
  }
}

// 第二步:輸入驗證碼,完成信箱變更
async function handleEmailVerifySubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('email-verify-btn');
  btn.disabled = true;
  hideMsg('email-msg');

  const code = document.getElementById('email-code').value;

  try {
    const res = await fetch('/api/members/me/email/verify', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentToken}`
      },
      body: JSON.stringify({ code })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg('email-msg', data.error || '驗證失敗', 'error');
      return;
    }

    // 更新 localStorage 裡存的會員資料,並換回「目前信箱」畫面
    const storedMember = JSON.parse(localStorage.getItem('member') || '{}');
    storedMember.email = data.email;
    localStorage.setItem('member', JSON.stringify(storedMember));

    showMsg('email-msg', data.message, 'success');
    renderEmailSection({ email: data.email, pending_email: null });
  } catch {
    showMsg('email-msg', '連線失敗,請確認伺服器是否正常運作', 'error');
  } finally {
    btn.disabled = false;
  }
}

async function handleEmailResend() {
  const btn = document.getElementById('email-resend-btn');
  btn.disabled = true;
  hideMsg('email-msg');

  try {
    const res = await fetch('/api/members/me/email/resend', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });
    const data = await res.json();
    showMsg('email-msg', data.message || (res.ok ? '驗證碼已重新寄出' : '寄送失敗'), res.ok && data.email_sent ? 'success' : 'error');
  } catch {
    showMsg('email-msg', '連線失敗,請確認伺服器是否正常運作', 'error');
  } finally {
    setTimeout(() => { btn.disabled = false; }, 3000);
  }
}

async function init() {
  if (!currentToken) {
    renderNotLoggedIn();
    return;
  }

  try {
    const res = await fetch('/api/members/me', {
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });

    if (res.status === 401) {
      localStorage.removeItem('token');
      localStorage.removeItem('member');
      renderNotLoggedIn();
      return;
    }

    const member = await res.json();
    renderForms(member);
  } catch {
    document.getElementById('content').innerHTML = `<div class="not-logged-in">讀取失敗,請確認伺服器是否正常運作</div>`;
  }
}

init();
</script>

</body>
</html>
