<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補湯菜單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F0E5;
    --paper-deep: #EDE5D3;
    --ink: #2B2620;
    --ink-soft: #5B5346;
    --herb: #4F6353;
    --herb-deep: #384A3C;
    --seal: #A63D2F;
    --seal-deep: #7F2E22;
    --border: #DDD2BC;
    --gold: #B08D57;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(79,99,83,0.05) 0, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(166,61,47,0.05) 0, transparent 40%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    padding: 56px 24px 32px;
    text-align: center;
    position: relative;
  }

  .header-actions {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 8px;
  }

  .member-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #FFFDF8;
    color: var(--ink-soft);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: border-color 0.2s, color 0.2s;
  }
  .member-btn:hover { border-color: var(--herb); color: var(--herb-deep); }
  .member-btn .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--off, #A6A196);
  }
  .member-btn.logged-in .dot { background: var(--herb); }

  .ai-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--herb);
    color: #F5F0E5;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .ai-btn:hover { background: var(--herb-deep); }

  @media (max-width: 480px) {
    .header-actions {
      position: static;
      justify-content: center;
      margin-top: 16px;
    }
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--herb);
    font-weight: 500;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(32px, 6vw, 52px);
    margin: 0 0 10px;
    letter-spacing: 0.08em;
    color: var(--ink);
  }

  .sub {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }

  .divider {
    width: 120px;
    height: 3px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 24px 40px;
  }

  .tab {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    font-weight: 700;
    padding: 9px 22px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.05em;
  }
  .tab:hover { border-color: var(--herb); color: var(--herb-deep); }
  .tab.active {
    background: var(--herb);
    border-color: var(--herb);
    color: #F5F0E5;
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 28px;
  }

  .category-header {
    grid-column: 1 / -1;
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--herb-deep);
    letter-spacing: 0.08em;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-top: 8px;
  }
  .category-header:first-child { margin-top: 0; }

  .card {
    background: #FFFDF8;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 30px rgba(43,38,32,0.12);
  }

  .photo {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--paper-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo .placeholder {
    color: var(--border);
    font-size: 13px;
    letter-spacing: 0.1em;
    font-family: 'Noto Serif TC', serif;
  }

  .card-price {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--seal);
  }

  .body {
    padding: 18px 20px 22px;
  }

  .name {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0 0 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    font-size: 11.5px;
    padding: 3px 10px;
    background: rgba(79,99,83,0.1);
    color: var(--herb-deep);
    border-radius: 999px;
    letter-spacing: 0.03em;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
  }
  .add-cart-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--herb);
    background: none;
    color: var(--herb-deep);
    cursor: pointer;
  }
  .add-cart-btn:hover { background: var(--herb); color: #F5F0E5; }
  .add-cart-btn:active { transform: scale(0.96); }

  /* 浮動購物車按鈕 */
  .cart-fab {
    position: fixed;
    right: 24px;
    bottom: 24px;
    background: var(--seal);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 22px;
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 14px;
    display: none;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(43,38,32,0.25);
    z-index: 40;
  }
  .cart-fab.show { display: inline-flex; }
  .cart-fab .badge {
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 12px;
  }

  /* 浮動 AI 湯品推薦按鈕（圖片輪播） */
  .ai-fab {
    position: fixed;
    right: 20px;
    bottom: 120px;
    width: 168px;
    z-index: 41;
    display: block;
    text-decoration: none;
    filter: drop-shadow(0 10px 20px rgba(43,38,32,0.25));
    transition: transform 0.2s ease;
  }
  .ai-fab:hover { transform: translateY(-4px) scale(1.04); }
  .ai-fab img {
    width: 100%;
    height: auto;
    display: block;
  }

  @media (max-width: 480px) {
    .ai-fab {
      width: 130px;
      right: 12px;
      bottom: 95px;
    }
  }

  /* 購物車彈窗 */
  .cart-modal { max-width: 420px; }
  .cart-modal .cart-header {
    padding: 22px 24px 4px;
  }
  .cart-modal .cart-header h3 {
    font-family: 'Noto Serif TC', serif;
    margin: 0;
    font-size: 19px;
  }
  .cart-items {
    padding: 8px 24px;
    max-height: 40vh;
    overflow-y: auto;
  }
  .cart-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .ci-name {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }
  .cart-item .ci-price {
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qty-control button {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .qty-control span { font-size: 13.5px; min-width: 16px; text-align: center; }

  .cart-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .cart-summary {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 14px;
  }
  .checkout-btn {
    width: 100%;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    padding: 12px 0;
    border: none;
    border-radius: 6px;
    background: var(--seal);
    color: #fff;
    cursor: pointer;
  }
  .checkout-btn:hover { background: #8f3527; }
  .checkout-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .cart-note {
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 10px;
  }
  .cart-note a { color: var(--herb-deep); }

  .upsell {
    padding: 4px 24px 18px;
    border-top: 1px solid var(--border);
  }
  .upsell-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--herb-deep);
    letter-spacing: 0.05em;
    margin: 14px 0 10px;
  }
  .upsell-list {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .upsell-item {
    flex: 0 0 auto;
    width: 96px;
    text-align: center;
  }
  .upsell-photo {
    width: 96px; height: 72px;
    border-radius: 6px;
    background: var(--paper-deep);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .upsell-photo img { width: 100%; height: 100%; object-fit: cover; }
  .upsell-name {
    font-size: 11.5px;
    line-height: 1.3;
    margin-bottom: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .upsell-price {
    font-size: 11px;
    color: var(--seal);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .upsell-add-btn {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 0;
    width: 100%;
    border-radius: 999px;
    border: 1px solid var(--herb);
    background: none;
    color: var(--herb-deep);
    cursor: pointer;
  }
  .upsell-add-btn:hover { background: var(--herb); color: #F5F0E5; }

  .toast {
    position: fixed;
    top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: #F5F0E5;
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(43,38,32,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .overlay.show { display: flex; }

  .modal {
    background: #FFFDF8;
    max-width: 480px;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
  }
  .modal .photo { aspect-ratio: 16/10; }
  .modal-body { padding: 26px 28px 30px; }
  .modal-body .name { font-size: 24px; }
  .modal-price {
    display: inline-block;
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    color: var(--seal);
    font-size: 18px;
    margin-bottom: 14px;
  }
  .section-label {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--herb);
    font-weight: 700;
    margin: 16px 0 4px;
  }
  .warn {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 0 2px;
  }
  .warn-chip {
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    line-height: 1.4;
  }
  .warn-chip.c0 { background: rgba(166,61,47,0.1);  color: #7F2E22; border-color: rgba(166,61,47,0.25); }
  .warn-chip.c1 { background: rgba(176,141,87,0.15); color: #7A5A28; border-color: rgba(176,141,87,0.3); }
  .warn-chip.c2 { background: rgba(79,99,83,0.12);   color: #384A3C; border-color: rgba(79,99,83,0.25); }
  .warn-chip.c3 { background: rgba(90,74,110,0.12);  color: #4A3A5C; border-color: rgba(90,74,110,0.25); }
  .close-btn {
    position: absolute;
    top: 12px; right: 12px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(43,38,32,0.55);
    color: #fff;
    border: none;
    font-size: 16px;
    cursor: pointer;
    z-index: 2;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-soft);
    font-family: 'Noto Serif TC', serif;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .card:hover { transition: none; transform: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-actions">
    <a href="/login.html" class="member-btn" id="member-btn">
      <span class="dot" id="member-dot"></span>
      <span id="member-label">會員登入</span>
    </a>
  </div>
  
  <h1>補 湯 菜 單</h1>
  <div class="sub">以時令藥材，溫養寸心氣血</div>
  <div class="divider"></div>
</header>

<script>
  (function checkMemberStatus() {
    const memberStr = localStorage.getItem('member');
    if (memberStr) {
      const member = JSON.parse(memberStr);
      document.getElementById('member-btn').classList.add('logged-in');
      document.getElementById('member-label').textContent = member.name || '會員專區';
    }
  })();
</script>

<div class="tabs" id="tabs"></div>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="overlay" id="cart-overlay">
  <div class="modal cart-modal" id="cart-modal-content"></div>
</div>

<a href="/facial-analysis.html" class="ai-fab" id="ai-fab">
  <img src="/uploads/ai-fab-1.png" alt="AI湯品推薦" id="ai-fab-img">
</a>

<button class="cart-fab" id="cart-fab" onclick="openCart()">
  🧺 購物車 <span class="badge" id="cart-count">0</span>
</button>

<div class="toast" id="toast"></div>

<script>
let allDishes = [];
let activeCategory = null;

async function load() {
  const res = await fetch('/api/dishes');
  allDishes = await res.json();
  buildTabs();
  render();
  checkPendingCartItem();
}

let pendingFacialRecordId = null;

function checkPendingCartItem() {
  const pending = localStorage.getItem('pendingCartItem');
  if (!pending) return;
  localStorage.removeItem('pendingCartItem');
  try {
    const { dish_id, record_id } = JSON.parse(pending);
    addToCart(dish_id);
    if (record_id) pendingFacialRecordId = record_id;
    setTimeout(() => showToast('已將 AI 推薦的湯品加入購物車'), 300);
  } catch {}
}

function buildTabs() {
  const cats = [...new Set(allDishes.map(d => d.category).filter(Boolean))];
  const tabOptions = ['全部', ...cats];
  activeCategory = '全部';
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = tabOptions.map(c =>
    `<button class="tab ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      tabsEl.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });
}

function render() {
  const grid = document.getElementById('grid');
  const showAll = activeCategory === '全部';
  const list = showAll ? allDishes : allDishes.filter(d => d.category === activeCategory);

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">此分類目前沒有供應中的品項</div>';
    return;
  }

  let html = '';
  let lastCategory = null;

  list.forEach(d => {
    // 「全部」檢視時，每次分類切換就插入一個標題，方便使用者知道現在看到哪一類
    if (showAll && d.category !== lastCategory) {
      html += `<div class="category-header">${d.category}</div>`;
      lastCategory = d.category;
    }
    html += `
      <div class="card" data-id="${d.id}">
        <div class="photo">
          ${d.image_url
            ? `<img src="${d.image_url}" alt="${d.name}">`
            : `<span class="placeholder">尚無照片</span>`}
        </div>
        <div class="body">
          <h3 class="name">${d.name}</h3>
          <p class="desc">${d.description || ''}</p>
          <div class="tags">
            ${(d.tags || '').split('、').filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
          <div class="card-footer">
            <span class="card-price">NT$ ${Math.round(d.price)}</span>
            <button class="add-cart-btn" data-add="${d.id}">加入購物車</button>
          </div>
        </div>
      </div>
    `;
  });

  grid.innerHTML = html;

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-add]')) return; // 點加入購物車按鈕時不要順便打開彈窗
      openModal(card.dataset.id);
    });
  });

  grid.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      addToCart(btn.dataset.add);
    });
  });
}

function openModal(id) {
  const d = allDishes.find(x => String(x.id) === String(id));
  if (!d) return;
  document.getElementById('modal').innerHTML = `
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="photo">
      ${d.image_url
        ? `<img src="${d.image_url}" alt="${d.name}">`
        : `<span class="placeholder">尚無照片</span>`}
    </div>
    <div class="modal-body">
      <h3 class="name">${d.name}</h3>
      <div class="modal-price">NT$ ${Math.round(d.price)}</div>
      <div class="tags">
        ${(d.tags || '').split('、').filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div class="section-label">功能說明</div>
      <p class="desc" style="-webkit-line-clamp: unset;">${d.description || '暫無說明'}</p>
      ${d.contraindication ? `
        <div class="section-label">飲用禁忌</div>
        <div class="warn">${renderContraChips(d.contraindication)}</div>
      ` : ''}
      <button class="add-cart-btn" style="margin-top:18px; width:100%; padding:11px 0;" onclick="addToCart(${d.id}); closeModal();">加入購物車</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}

function renderContraChips(text) {
  const items = text.split(/[、;；]/).map(t => t.trim()).filter(Boolean);
  return items.map((item, i) =>
    `<span class="warn-chip c${i % 4}">${item}</span>`
  ).join('');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

// ============ 購物車功能 ============
let cart = []; // [{ dish_id, name, price, quantity }]

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function addToCart(dishId) {
  const d = allDishes.find(x => String(x.id) === String(dishId));
  if (!d) return;

  const existing = cart.find(c => c.dish_id === d.id);
  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({ dish_id: d.id, name: d.name, price: d.price, quantity: 1 });
  }
  showToast(`已加入「${d.name}」`);
  updateCartFab();
}

function updateCartFab() {
  const totalQty = cart.reduce((sum, c) => sum + c.quantity, 0);
  const fab = document.getElementById('cart-fab');
  document.getElementById('cart-count').textContent = totalQty;
  fab.classList.toggle('show', totalQty > 0);
}

function openCart() {
  renderCartModal();
  document.getElementById('cart-overlay').classList.add('show');
}

function closeCart() {
  document.getElementById('cart-overlay').classList.remove('show');
}

function changeQty(dishId, delta) {
  const item = cart.find(c => c.dish_id === dishId);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) {
    cart = cart.filter(c => c.dish_id !== dishId);
  }
  updateCartFab();
  renderCartModal();
  if (cart.length === 0) closeCart();
}

function renderCartModal() {
  const el = document.getElementById('cart-modal-content');
  const total = cart.reduce((sum, c) => sum + Number(c.price) * c.quantity, 0);
  const isLoggedIn = !!localStorage.getItem('token');

  el.innerHTML = `
    <button class="close-btn" onclick="closeCart()">✕</button>
    <div class="cart-header"><h3>我的購物車</h3></div>
    <div class="cart-items">
      ${cart.length === 0
        ? '<div class="cart-empty">購物車是空的，先去菜單挑幾道湯吧</div>'
        : cart.map(c => `
          <div class="cart-item">
            <div>
              <div class="ci-name">${c.name}</div>
              <div class="ci-price">NT$ ${Math.round(c.price)}</div>
            </div>
            <div class="qty-control">
              <button onclick="changeQty(${c.dish_id}, -1)">−</button>
              <span>${c.quantity}</span>
              <button onclick="changeQty(${c.dish_id}, 1)">+</button>
            </div>
          </div>
        `).join('')}
    </div>
    ${cart.length > 0 ? `
      <div class="cart-summary">
        <div class="cart-total">
          <span>總計</span>
          <span>NT$ ${Math.round(total)}</span>
        </div>
<button class="checkout-btn" id="checkout-btn" onclick="submitOrder()">送出訂單</button>
${!isLoggedIn ? `<div class="cart-note">未登入將以訪客身分送出，<a href="/login.html">登入會員</a>可保留訂單歷史</div>` : ''}
      </div>
    ` : ''}
    ${renderUpsell()}
  `;
}

function renderUpsell() {
  const hasSoup = cart.some(c => {
    const d = allDishes.find(x => x.id === c.dish_id);
    return d && d.category === '補湯';
  });
  if (!hasSoup) return '';

  const cartIds = new Set(cart.map(c => c.dish_id));
  const candidates = allDishes.filter(d => d.category !== '補湯' && !cartIds.has(d.id));

  // 盡量從不同分類各挑一點，不要整排都同一類（例如都是飲料）
  const byCategory = {};
  candidates.forEach(d => {
    if (!byCategory[d.category]) byCategory[d.category] = [];
    byCategory[d.category].push(d);
  });
  const suggestions = [];
  let round = 0;
  while (suggestions.length < 6 && Object.values(byCategory).some(arr => arr.length > round)) {
    Object.values(byCategory).forEach(arr => {
      if (arr[round] && suggestions.length < 6) suggestions.push(arr[round]);
    });
    round++;
  }

  if (suggestions.length === 0) return '';

  return `
    <div class="upsell">
      <div class="upsell-title">☕ 要不要加點這些？</div>
      <div class="upsell-list">
        ${suggestions.map(d => `
          <div class="upsell-item">
            <div class="upsell-photo">
              ${d.image_url ? `<img src="${d.image_url}" alt="${d.name}">` : '尚無照片'}
            </div>
            <div class="upsell-name">${d.name}</div>
            <div class="upsell-price">NT$ ${Math.round(d.price)}</div>
            <button class="upsell-add-btn" onclick="addToCart(${d.id}); renderCartModal();">加入</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function submitOrder() {
  const token = localStorage.getItem('token');
  const btn = document.getElementById('checkout-btn');
  const guestName = '';

  btn.disabled = true;
  btn.textContent = '送出中...';

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const res = await fetch('/api/orders', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        items: cart.map(c => ({ dish_id: c.dish_id, quantity: c.quantity })),
        guest_name: guestName,
        facial_record_id: pendingFacialRecordId
      })
    });
    const data = await res.json();

    if (!res.ok) {
      showToast(data.error || '訂單送出失敗');
      btn.disabled = false;
      btn.textContent = '送出訂單';
      return;
    }

    cart = [];
    pendingFacialRecordId = null;
    updateCartFab();
    closeCart();
    showToast('訂單已送出，謝謝您的訂購！');
  } catch {
    showToast('連線失敗，請確認伺服器是否正常運作');
    btn.disabled = false;
    btn.textContent = '送出訂單';
  }
}

document.getElementById('cart-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'cart-overlay') closeCart();
});

load();

// AI 湯品推薦浮動按鈕：三張圖片自動輪播
(function rotateAiFab() {
  const images = ['/uploads/ai-fab-1.png', '/uploads/ai-fab-2.png', '/uploads/ai-fab-3.png'];
  let index = 0;
  const img = document.getElementById('ai-fab-img');
  setInterval(() => {
    index = (index + 1) % images.length;
    img.src = images[index];
  }, 5000);
})();
</script>
