<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 湯品推薦 — 補湯菜單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F0E5;
    --paper-deep: #EAE2D0;
    --ink: #2B2620;
    --ink-soft: #6B6255;
    --herb: #4F6353;
    --herb-deep: #384A3C;
    --seal: #A63D2F;
    --border: #DDD2BC;
    --gold: #B08D57;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(79,99,83,0.06) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(166,61,47,0.05) 0, transparent 40%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    padding: 44px 24px 20px;
    text-align: center;
    position: relative;
  }
  .back-link {
    position: absolute;
    top: 24px; left: 24px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover { color: var(--herb-deep); }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--herb);
    font-weight: 500;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 28px;
    margin: 0 0 8px;
    letter-spacing: 0.05em;
  }
  .sub {
    font-size: 13px;
    color: var(--ink-soft);
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 24px 140px;
  }

  .not-logged-in {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .not-logged-in a { color: var(--herb-deep); font-weight: 700; }

  .upload-card {
    background: #FFFDF8;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 26px;
    text-align: center;
  }

  .camera-box {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .camera-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* 前鏡頭鏡像顯示，看起來像照鏡子比較自然 */
  }
  #face-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    pointer-events: none;
  }
  .detect-status {
    position: absolute;
    left: 0; right: 0; bottom: 10px;
    text-align: center;
    font-size: 12px;
    color: #F5F0E5;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  .capture-ring {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .capture-ring svg { width: 100%; height: 100%; }
  .capture-ring circle {
    fill: none;
    stroke: var(--herb);
    stroke-width: 5;
    stroke-linecap: round;
    transform-origin: center;
    transform: rotate(-90deg);
    transition: stroke-dashoffset 0.08s linear;
    opacity: 0;
  }
  .capture-ring circle.active { opacity: 1; }
  .camera-placeholder {
    color: rgba(245,240,229,0.75);
    font-size: 12.5px;
    padding: 20px;
    line-height: 1.7;
  }
  .camera-placeholder .icon { font-size: 28px; margin-bottom: 8px; }

  .album-link {
    display: inline-block;
    margin-top: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--herb-deep);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
  }

  .camera-error {
    color: var(--seal);
    font-size: 12.5px;
    max-width: 320px;
    margin: 0 auto;
  }

  .preview-wrap { display: none; }
  .preview-wrap.show { display: block; }
  .preview-img {
    max-width: 100%;
    max-height: 260px;
    border-radius: 6px;
    margin-bottom: 14px;
  }

  .analyze-btn {
    margin-top: 18px;
    width: 100%;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    padding: 12px 0;
    border: none;
    border-radius: 6px;
    background: var(--seal);
    color: #fff;
    cursor: pointer;
  }
  .analyze-btn:hover { background: #8f3527; }
  .analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .disclaimer {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 14px;
    line-height: 1.6;
  }

  .loading {
    display: none;
    text-align: center;
    padding: 50px 20px;
  }
  .loading.show { display: block; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--herb);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .msg { font-size: 13px; color: var(--ink-soft); }

  .result {
    display: none;
    margin-top: 22px;
  }
  .result.show { display: block; }

  .result-section {
    background: #FFFDF8;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px 24px;
    margin-bottom: 16px;
  }

  .constitution-badge {
    display: inline-block;
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--seal);
    margin-bottom: 4px;
  }
  .constitution-label { font-size: 11.5px; color: var(--ink-soft); letter-spacing: 0.1em; margin-bottom: 6px; }
  .reasoning { font-size: 13.5px; line-height: 1.7; color: var(--ink); margin-top: 10px; }

  .feature-grid {
    display: grid;
    gap: 12px;
    margin-top: 4px;
  }
  .feature-row .flabel {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--herb-deep);
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }
  .feature-row .fvalue {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.6;
  }

  .dish-card {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .dish-photo {
    width: 84px; height: 84px;
    border-radius: 6px;
    background: var(--paper-deep);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    color: var(--ink-soft);
  }
  .dish-photo img { width: 100%; height: 100%; object-fit: cover; }
  .dish-info .dname {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 4px;
  }
  .dish-info .dprice { font-size: 13px; color: var(--seal); font-weight: 700; }
  .rec-reason {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  /* 推薦湯品的飲用禁忌提醒（樣式與首頁菜單卡片一致） */
  .card-warn {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    margin-top: 12px;
  }
  .card-warn-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--seal);
    letter-spacing: 0.08em;
    margin-right: 2px;
  }
  .warn-chip {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
    line-height: 1.4;
  }
  .warn-chip.c0 { background: rgba(166,61,47,0.1);  color: #7F2E22; border-color: rgba(166,61,47,0.25); }
  .warn-chip.c1 { background: rgba(176,141,87,0.15); color: #7A5A28; border-color: rgba(176,141,87,0.3); }
  .warn-chip.c2 { background: rgba(79,99,83,0.12);   color: #384A3C; border-color: rgba(79,99,83,0.25); }
  .warn-chip.c3 { background: rgba(90,74,110,0.12);  color: #4A3A5C; border-color: rgba(90,74,110,0.25); }

  .add-cart-btn {
    width: 100%;
    margin-top: 16px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 11px 0;
    border-radius: 6px;
    border: 1px solid var(--herb);
    background: none;
    color: var(--herb-deep);
    cursor: pointer;
  }
  .add-cart-btn:hover { background: var(--herb); color: #F5F0E5; }

  /* AI 推薦卡片數量選擇器 */
  .recommended-order-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  .recommended-qty-control {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 112px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--paper);
  }
  .recommended-qty-control button {
    width: 29px;
    height: 29px;
    border: 1px solid var(--herb);
    border-radius: 50%;
    background: #FFFDF8;
    color: var(--herb-deep);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .recommended-qty-control button:hover {
    background: var(--herb);
    color: #F5F0E5;
  }
  .recommended-qty-value {
    min-width: 18px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
  }
  .recommended-order-actions .add-cart-btn {
    flex: 1;
    width: auto;
    margin-top: 0;
  }
  @media (max-width: 380px) {
    .recommended-order-actions { gap: 7px; }
    .recommended-qty-control { min-width: 100px; gap: 7px; }
    .recommended-order-actions .add-cart-btn { font-size: 12.5px; }
  }

  .retry-btn {
    display: block;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 6px;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    width: 100%;
  }

  .error-box {
    display: none;
    background: rgba(166,61,47,0.08);
    border: 1px solid rgba(166,61,47,0.25);
    color: var(--seal);
    font-size: 13px;
    padding: 12px 16px;
    border-radius: 6px;
    margin-top: 16px;
  }
  .error-box.show { display: block; }

  /* 底部「確認點完餐」固定列 */
  .confirm-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #FFFDF8;
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 -6px 20px rgba(43,38,32,0.1);
    z-index: 60;
  }
  .confirm-bar.show { display: flex; }
  .confirm-bar-inner {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
  }
  .confirm-cancel-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
  }
  .confirm-cancel-btn:hover { color: var(--seal); }
  .confirm-count {
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .confirm-count strong {
    color: var(--herb-deep);
    font-size: 15px;
  }
  .confirm-bar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .confirm-view-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid var(--herb);
    background: none;
    color: var(--herb-deep);
    cursor: pointer;
    white-space: nowrap;
  }
  .confirm-view-btn:hover { background: var(--herb); color: #F5F0E5; }
  .confirm-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    padding: 11px 22px;
    border: none;
    border-radius: 6px;
    background: var(--herb);
    color: #F5F0E5;
    cursor: pointer;
    white-space: nowrap;
  }
  .confirm-btn:hover { background: var(--herb-deep); }
  .confirm-submit-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    padding: 11px 18px;
    border: none;
    border-radius: 6px;
    background: var(--seal);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .confirm-submit-btn:hover { background: #8f3527; }
  .confirm-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  @media (max-width: 480px) {
    .confirm-bar-inner { flex-direction: column; align-items: stretch; }
    .confirm-bar-actions { justify-content: space-between; }
  }

  /* 提示訊息 */
  .toast {
    position: fixed;
    top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: #F5F0E5;
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 「查看購物車」彈窗（顯示這次分析目前選好的品項） */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(43,38,32,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 70;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #FFFDF8;
    max-width: 420px;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
  }
  .close-btn {
    position: absolute;
    top: 12px; right: 12px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(43,38,32,0.55);
    color: #fff;
    border: none;
    font-size: 16px;
    cursor: pointer;
    z-index: 2;
  }
  .cart-header { padding: 22px 24px 4px; }
  .cart-header h3 {
    font-family: 'Noto Serif TC', serif;
    margin: 0;
    font-size: 19px;
  }
  .cart-items {
    padding: 8px 24px;
    max-height: 40vh;
    overflow-y: auto;
  }
  .cart-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .ci-name {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }
  .cart-item .ci-price {
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qty-control button {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .qty-control span { font-size: 13.5px; min-width: 16px; text-align: center; }
  .cart-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }
  .cart-summary {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 14px;
  }
  .checkout-btn {
    width: 100%;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    padding: 12px 0;
    border: none;
    border-radius: 6px;
    background: var(--seal);
    color: #fff;
    cursor: pointer;
  }
  .checkout-btn:hover { background: #8f3527; }
</style>
</head>
<body>

<header>
  <a href="/index.html" class="back-link" style="font-size: 18px; font-weight: bold;">← 返回菜單</a>

  <h1>AI 湯品推薦</h1>
  <div class="sub">將臉對準畫面，偵測到臉部會自動拍照</div>
</header>

<main id="main">
  <!-- 內容由 JS 動態渲染 -->
</main>

<div class="confirm-bar" id="confirm-bar">
  <div class="confirm-bar-inner">
    <button type="button" class="confirm-cancel-btn" onclick="cancelAndReturn()">取消，返回首頁</button>
    <div class="confirm-count">已選擇 <strong id="confirm-count-num">0</strong> 道餐點</div>
    <div class="confirm-bar-actions">
      <button type="button" class="confirm-view-btn" onclick="openSelectedCart()">查看購物車</button>
      <button type="button" class="confirm-btn" onclick="confirmOrder()">前往首頁購物車</button>
      <button type="button" class="confirm-submit-btn" id="direct-submit-btn-bar" onclick="submitOrderDirectly()">直接送出訂單</button>
    </div>
  </div>
</div>

<div class="overlay" id="cart-overlay">
  <div class="modal" id="cart-modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<canvas id="camera-canvas" style="display:none;"></canvas>

<script>
// token 現在是「可有可無」：訪客沒有 token 一樣能分析，
// 只是分析結果不會存進會員的歷史紀錄裡。
const token = localStorage.getItem('token');
let selectedFile = null;
let cameraStream = null;
// 每道 AI 推薦湯品各自記錄選擇數量
const recommendedQuantities = {};
// 購物車跟首頁(index.html)共用同一份資料，存在 localStorage 的 'cart'，
// 這樣不管是在首頁加的、還是在這裡用 AI 推薦加的，兩邊看到的都是同一台購物車
function loadCart() {
  try {
    const raw = localStorage.getItem('cart');
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}
function saveCart() {
  try {
    localStorage.setItem('cart', JSON.stringify(cart));
  } catch {}
}
let cart = loadCart(); // [{ dish_id, name, price, quantity }]

function renderUploadUI() {
  document.getElementById('main').innerHTML = `
    <div class="upload-card">
      <div class="camera-box" id="camera-box">
        <div class="camera-placeholder" id="camera-placeholder">
          <div class="icon">📷</div>
          正在開啟相機...
        </div>
      </div>

      <div class="preview-wrap" id="preview-wrap">
        <img class="preview-img" id="preview-img" alt="預覽照片">
        <div>
          <button class="album-link" id="retake-btn">重新拍攝</button>
        </div>
      </div>

      <button class="analyze-btn" id="analyze-btn" disabled>開始分析</button>
      <div class="disclaimer">這是AI的養生參考，並非醫療診斷。若有健康疑慮，請諮詢專業醫師。${token ? '' : '<br>未登入也能使用；若<a href="/login.html">登入會員</a>，這次的分析結果會保存在您的紀錄中。'}</div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="msg">AI 正在分析中，約需幾秒鐘...</div>
    </div>

    <div class="error-box" id="error-box"></div>

    <div class="result" id="result"></div>
  `;

  document.getElementById('retake-btn').addEventListener('click', resetToCamera);
  document.getElementById('analyze-btn').addEventListener('click', analyze);

  openCamera();
}

// ---- 相機（頁面一開就直接嘗試開啟，直接在畫面上即時預覽）----
async function openCamera() {
  const box = document.getElementById('camera-box');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    box.innerHTML = `<div class="camera-error">此瀏覽器不支援相機功能，暫時無法使用 AI 分析</div>`;
    return;
  }

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });
    box.innerHTML = `
      <video id="camera-video" autoplay playsinline muted></video>
      <canvas id="face-overlay"></canvas>
      <div class="capture-ring" id="capture-ring">
        <svg viewBox="0 0 100 100">
          <circle id="capture-ring-circle" cx="50" cy="50" r="46" stroke-dasharray="289" stroke-dashoffset="289"></circle>
        </svg>
      </div>
      <div class="detect-status" id="detect-status">正在準備臉部偵測...</div>
    `;
    const video = document.getElementById('camera-video');
    video.srcObject = cameraStream;

    video.addEventListener('loadedmetadata', () => {
      initFaceDetection(video);
    }, { once: true });
  } catch (err) {
    box.innerHTML = `<div class="camera-error">無法開啟相機，請確認已允許瀏覽器使用相機權限後重新整理頁面</div>`;
  }
}

// ---- 臉部偵測（自動拍照 + 即時輪廓線）----
// 用 Google MediaPipe Face Landmarker，完全在瀏覽器端運算，免費、不呼叫任何伺服器
let faceLandmarker = null;
let detectionRafId = null;
let stableFrameCount = 0;
let autoCaptured = false;
const STABLE_FRAMES_NEEDED = 36; // 約 1.2 秒（依畫面更新率浮動），持續偵測到臉才會自動拍照
const CIRCLE_CIRCUMFERENCE = 289; // 2 * π * 46（圓環半徑46）

let mediapipeReady = false;
let cachedFaceLandmarkerClass = null;
let cachedDrawingUtilsClass = null;

async function initFaceDetection(video) {
  const statusEl = document.getElementById('detect-status');

  // 模型已經載入過的話（例如使用者按了「重新拍攝」），直接重用，不用再下載一次
  if (mediapipeReady && faceLandmarker && cachedFaceLandmarkerClass && cachedDrawingUtilsClass) {
    if (statusEl) statusEl.textContent = '請將臉部置於畫面中央';
    startDetectionLoop(video, cachedFaceLandmarkerClass, cachedDrawingUtilsClass);
    return;
  }

  if (statusEl) statusEl.textContent = '正在載入臉部偵測模型...';

  try {
    const visionModule = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const { FaceLandmarker, FilesetResolver, DrawingUtils } = visionModule;

    const filesetResolver = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );

    // 先試 GPU 加速，很多電腦/瀏覽器組合會失敗，失敗的話自動退回 CPU 模式（穩定但稍慢）
    try {
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1
      });
      console.log('臉部偵測模型已用 GPU 模式載入');
    } catch (gpuErr) {
      console.warn('GPU 模式載入失敗，改用 CPU 模式:', gpuErr);
      if (statusEl) statusEl.textContent = '正在改用相容模式載入...';
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'CPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1
      });
      console.log('臉部偵測模型已用 CPU 模式載入');
    }

    cachedFaceLandmarkerClass = FaceLandmarker;
    cachedDrawingUtilsClass = DrawingUtils;
    mediapipeReady = true;
    if (statusEl) statusEl.textContent = '請將臉部置於畫面中央';
    startDetectionLoop(video, FaceLandmarker, DrawingUtils);
  } catch (err) {
    console.error('臉部偵測模型載入失敗（GPU、CPU 模式皆失敗）:', err);
    // 兩種模式都失敗，明確告知使用者，並保留手動快門可以正常拍照
    if (statusEl) statusEl.textContent = '自動偵測目前無法使用，請用下方快門手動拍照';
  }
}

function startDetectionLoop(video, FaceLandmarkerClass, DrawingUtilsClass) {
  const canvas = document.getElementById('face-overlay');
  if (!canvas) return;

  if (!video.videoWidth || !video.videoHeight) {
    // 影片尺寸還沒準備好，稍等一下再重試，避免畫布被設成 0×0
    setTimeout(() => startDetectionLoop(video, FaceLandmarkerClass, DrawingUtilsClass), 100);
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext('2d');
  const drawingUtils = new DrawingUtilsClass(ctx);
  let lastVideoTime = -1;

  function frame() {
    const currentVideo = document.getElementById('camera-video');
    const currentCanvas = document.getElementById('face-overlay');
    if (!currentVideo || !currentCanvas || autoCaptured) {
      return; // 相機已關閉或已經自動拍照，停止這個迴圈
    }

    if (currentVideo.readyState >= 2 && currentVideo.currentTime !== lastVideoTime) {
      lastVideoTime = currentVideo.currentTime;

      let results;
      try {
        results = faceLandmarker.detectForVideo(currentVideo, performance.now());
      } catch (detectErr) {
        console.error('單次臉部偵測失敗，跳過這一幀:', detectErr);
        detectionRafId = requestAnimationFrame(frame);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const statusEl = document.getElementById('detect-status');

      if (results.faceLandmarks && results.faceLandmarks.length > 0) {
        const landmarks = results.faceLandmarks[0];
        drawingUtils.drawConnectors(
          landmarks,
          FaceLandmarkerClass.FACE_LANDMARKS_FACE_OVAL,
          { color: '#8FBF8A', lineWidth: 2 }
        );

        stableFrameCount++;
        const progress = Math.min(stableFrameCount / STABLE_FRAMES_NEEDED, 1);
        updateCaptureRing(progress);
        if (statusEl) statusEl.textContent = progress < 1 ? '偵測到臉部，保持不動...' : '';

        if (stableFrameCount >= STABLE_FRAMES_NEEDED && !autoCaptured) {
          autoCaptured = true;
          takePhoto();
          return;
        }
      } else {
        stableFrameCount = 0;
        updateCaptureRing(0);
        if (statusEl) statusEl.textContent = '請將臉部置於畫面中央';
      }
    }

    detectionRafId = requestAnimationFrame(frame);
  }

  detectionRafId = requestAnimationFrame(frame);
}

function updateCaptureRing(progress) {
  const circle = document.getElementById('capture-ring-circle');
  if (!circle) return;
  circle.classList.toggle('active', progress > 0);
  circle.setAttribute('stroke-dashoffset', CIRCLE_CIRCUMFERENCE * (1 - progress));
}

function resetFaceDetection() {
  stableFrameCount = 0;
  autoCaptured = false;
  if (detectionRafId) {
    cancelAnimationFrame(detectionRafId);
    detectionRafId = null;
  }
}

function stopCamera() {
  resetFaceDetection();
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

function takePhoto() {
  const video = document.getElementById('camera-video');
  if (!video) return;
  const canvas = document.getElementById('camera-canvas');

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  // 因為預覽是鏡像顯示，拍下來也鏡像回來，跟使用者看到的畫面一致
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  canvas.toBlob((blob) => {
    if (!blob) return;
    const file = new File([blob], `camera_${Date.now()}.jpg`, { type: 'image/jpeg' });
    handleFile(file);
  }, 'image/jpeg', 0.92);
}

function resetToCamera() {
  selectedFile = null;
  resetFaceDetection();
  document.getElementById('preview-wrap').classList.remove('show');
  document.getElementById('camera-box').style.display = 'flex';
  document.getElementById('analyze-btn').disabled = true;
  openCamera(); // 重新拍攝一律重開相機，狀態最乾淨、不容易出錯
}

function handleFile(file) {
  selectedFile = file;
  stopCamera();
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('camera-box').style.display = 'none';
    document.getElementById('preview-wrap').classList.add('show');
    document.getElementById('preview-img').src = e.target.result;
    document.getElementById('analyze-btn').disabled = false;
  };
  reader.readAsDataURL(file);
}

async function analyze() {
  if (!selectedFile) return;

  document.querySelector('.upload-card').style.display = 'none';
  document.getElementById('loading').classList.add('show');
  document.getElementById('error-box').classList.remove('show');

  const formData = new FormData();
  formData.append('photo', selectedFile);

  try {
    const headers = {};
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const res = await fetch('/api/facial-analysis', {
      method: 'POST',
      headers,
      body: formData
    });
    const data = await res.json();

    document.getElementById('loading').classList.remove('show');

    if (!res.ok) {
      showError(data.error || '分析失敗，請稍後再試');
      document.querySelector('.upload-card').style.display = 'block';
      return;
    }

    await renderResult(data);
  } catch {
    document.getElementById('loading').classList.remove('show');
    showError('連線失敗，請確認伺服器是否正常運作');
    document.querySelector('.upload-card').style.display = 'block';
  }
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.classList.add('show');
}

// 禁忌資料從菜單 API 取得（跟首頁同一份資料），用 dish id 對應，只抓一次並快取
let dishContraMap = null;
async function loadDishContraMap() {
  if (dishContraMap) return dishContraMap;
  try {
    const res = await fetch('/api/dishes');
    const list = await res.json();
    const map = {};
    list.forEach(d => { map[d.id] = d.contraindication || ''; });
    dishContraMap = map;
    return map;
  } catch {
    return {}; // 抓不到就不顯示禁忌，不影響其他功能，下次再重試
  }
}

function renderContraChips(text) {
  const items = String(text).split(/[、;；]/).map(t => t.trim()).filter(Boolean);
  return items.map((item, i) =>
    `<span class="warn-chip c${i % 4}">${item}</span>`
  ).join('');
}

async function renderResult(data) {
  const dishes = Array.isArray(data.recommended_dishes) ? data.recommended_dishes : [];
  const contraMap = await loadDishContraMap();

  document.getElementById('result').innerHTML = `
    <div class="result-section">
      <div class="constitution-label">AI 判斷體質傾向</div>
      <div class="constitution-badge">${data.constitution || '—'}</div>
      <div class="reasoning">${data.reasoning || ''}</div>

      <div class="feature-grid" style="margin-top:18px;">
        <div class="feature-row">
          <div class="flabel">臉部氣色</div>
          <div class="fvalue">${data.face_features || '無明顯特徵描述'}</div>
        </div>
        <div class="feature-row">
          <div class="flabel">眼周狀態</div>
          <div class="fvalue">${data.eye_features || '無明顯特徵描述'}</div>
        </div>
        ${data.tongue_features ? `
          <div class="feature-row">
            <div class="flabel">舌象觀察</div>
            <div class="fvalue">${data.tongue_features}</div>
          </div>
        ` : ''}
      </div>
    </div>

    ${dishes.map((dish, i) => `
      <div class="result-section">
        <div class="constitution-label">為您推薦</div>
        <div class="dish-card">
          <div class="dish-photo">
            ${dish.image_url ? `<img src="${dish.image_url}" alt="${dish.name}">` : '尚無照片'}
          </div>
          <div class="dish-info">
            <div class="dname">${dish.name}</div>
            <div class="dprice">NT$ ${Math.round(dish.price)}</div>
          </div>
        </div>
        <div class="rec-reason">${dish.reason || ''}</div>
        ${(dish.contraindication || contraMap[dish.id]) ? `
          <div class="card-warn">
            <span class="card-warn-label">⚠ 禁忌</span>
            ${renderContraChips(dish.contraindication || contraMap[dish.id])}
          </div>
        ` : ''}
        <div class="recommended-order-actions">
          <div class="recommended-qty-control" aria-label="選擇${dish.name}數量">
            <button type="button" onclick="changeRecommendedQty(${dish.id}, -1)" aria-label="減少數量">−</button>
            <span class="recommended-qty-value" id="recommended-qty-${dish.id}">${recommendedQuantities[dish.id] || 1}</span>
            <button type="button" onclick="changeRecommendedQty(${dish.id}, 1)" aria-label="增加數量">+</button>
          </div>
          <button class="add-cart-btn" onclick="addRecommendedToCart(${dish.id}, '${dish.name}', ${dish.price}, ${data.record_id || 'null'})">
            加入購物車
          </button>
        </div>
      </div>
    `).join('')}

    <button class="retry-btn" onclick="location.reload()">重新上傳照片再測一次</button>
  `;

  document.getElementById('result').classList.add('show');
}

function changeRecommendedQty(dishId, delta) {
  const currentQty = recommendedQuantities[dishId] || 1;
  recommendedQuantities[dishId] = Math.max(1, currentQty + delta);
  const qtyEl = document.getElementById(`recommended-qty-${dishId}`);
  if (qtyEl) qtyEl.textContent = recommendedQuantities[dishId];
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// 把一道湯品加進（跟首頁共用的）購物車，已經在裡面的話直接累加份數
function addToCart(dishId, dishName, price, quantity = 1) {
  const addQuantity = Math.max(1, Number(quantity) || 1);
  const existing = cart.find(c => String(c.dish_id) === String(dishId));
  if (existing) {
    existing.quantity += addQuantity;
  } else {
    cart.push({ dish_id: dishId, name: dishName, price, quantity: addQuantity });
  }
  saveCart();
  showToast(`已將「${dishName}」${addQuantity} 份加入購物車`);
  updateConfirmBar();
}

// AI 推薦卡片的「加入購物車」：用卡片上選好的數量加進購物車，
// 並記住這次分析的 facial_record_id，供稍後送出訂單時關聯
function addRecommendedToCart(dishId, dishName, price, recordId) {
  const quantity = recommendedQuantities[dishId] || 1;
  addToCart(dishId, dishName, price, quantity);

  if (recordId) {
    try { localStorage.setItem('pendingFacialRecordId', String(recordId)); } catch {}
  }

  // 加入後把這張卡片的數量選擇器重設為 1，跟首頁菜單卡片的習慣一致
  recommendedQuantities[dishId] = 1;
  const qtyEl = document.getElementById(`recommended-qty-${dishId}`);
  if (qtyEl) qtyEl.textContent = '1';
}

function updateConfirmBar() {
  const count = cart.length;
  const bar = document.getElementById('confirm-bar');
  const numEl = document.getElementById('confirm-count-num');
  if (!bar || !numEl) return;
  numEl.textContent = count;
  bar.classList.toggle('show', count > 0);
}

// 「查看購物車」：顯示跟首頁共用的購物車，可調整份數或移除
function openSelectedCart() {
  renderSelectedCartModal();
  document.getElementById('cart-overlay').classList.add('show');
}

function closeSelectedCart() {
  document.getElementById('cart-overlay').classList.remove('show');
}

function renderSelectedCartModal() {
  const el = document.getElementById('cart-modal-content');
  const total = cart.reduce((sum, c) => sum + Number(c.price || 0) * c.quantity, 0);

  el.innerHTML = `
    <button class="close-btn" onclick="closeSelectedCart()">✕</button>
    <div class="cart-header"><h3>我的購物車</h3></div>
    <div class="cart-items">
      ${cart.length === 0
        ? '<div class="cart-empty">購物車是空的，先選幾道湯品吧</div>'
        : cart.map(c => `
          <div class="cart-item">
            <div>
              <div class="ci-name">${c.name}</div>
              <div class="ci-price">NT$ ${Math.round(c.price || 0)}</div>
            </div>
            <div class="qty-control">
              <button onclick="changeCartQty(${c.dish_id}, -1)">−</button>
              <span>${c.quantity}</span>
              <button onclick="changeCartQty(${c.dish_id}, 1)">+</button>
            </div>
          </div>
        `).join('')}
    </div>
    ${cart.length > 0 ? `
      <div class="cart-summary">
        <div class="cart-total">
          <span>總計</span>
          <span>NT$ ${Math.round(total)}</span>
        </div>
        <button class="checkout-btn" id="direct-submit-btn-modal" onclick="submitOrderDirectly()">直接送出訂單</button>
        <button class="add-cart-btn" style="margin-top:10px;" onclick="confirmOrder()">前往首頁購物車</button>
      </div>
    ` : ''}
  `;
}

function changeCartQty(dishId, delta) {
  const item = cart.find(c => String(c.dish_id) === String(dishId));
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) {
    cart = cart.filter(c => String(c.dish_id) !== String(dishId));
  }
  saveCart();
  updateConfirmBar();
  renderSelectedCartModal();
  if (cart.length === 0) closeSelectedCart();
}

document.getElementById('cart-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'cart-overlay') closeSelectedCart();
});

// 取消，直接回首頁（購物車本來就跟首頁共用、已經即時存進 localStorage，
// 這裡不需要做任何清除，單純只是導覽離開）
function cancelAndReturn() {
  window.location.href = '/index.html';
}

// 購物車已經跟首頁共用了，這顆按鈕只是單純導覽回首頁，方便繼續逛菜單、加點其他東西
function confirmOrder() {
  window.location.href = '/index.html';
}

// 直接把目前購物車裡的品項送出訂單，不用先跳回菜單頁，訂單會立刻出現在廚房後台
async function submitOrderDirectly() {
  if (cart.length === 0) return;

  const barBtn = document.getElementById('direct-submit-btn-bar');
  const modalBtn = document.getElementById('direct-submit-btn-modal');
  [barBtn, modalBtn].forEach(btn => {
    if (btn) { btn.disabled = true; btn.textContent = '送出中...'; }
  });

  const recordId = localStorage.getItem('pendingFacialRecordId') || null;

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const res = await fetch('/api/orders', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        items: cart.map(c => ({ dish_id: c.dish_id, quantity: c.quantity })),
        guest_name: '',
        facial_record_id: recordId
      })
    });
    const data = await res.json();

    if (!res.ok) {
      showToast(data.error || '訂單送出失敗');
      return;
    }

    cart = [];
    saveCart();
    localStorage.removeItem('pendingFacialRecordId');
    updateConfirmBar();
    closeSelectedCart();
    showToast('訂單已送出，謝謝您的訂購！');
  } catch {
    showToast('連線失敗，請確認伺服器是否正常運作');
  } finally {
    [barBtn, modalBtn].forEach(btn => {
      if (btn) { btn.disabled = false; btn.textContent = '直接送出訂單'; }
    });
  }
}

// 初始化：訪客與會員都直接進入上傳畫面
renderUploadUI();
// 購物車是跟首頁共用的，所以一進頁面就先依目前購物車內容把底部列顯示出來
updateConfirmBar();
</script>
