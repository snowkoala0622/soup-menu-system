<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廚房後台 — 補湯菜單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F0E5;
    --paper-deep: #EAE2D0;
    --ink: #2B2620;
    --ink-soft: #6B6255;
    --herb: #4F6353;
    --herb-deep: #384A3C;
    --seal: #A63D2F;
    --border: #DDD2BC;
    --gold: #B08D57;
    --alert-red: #E63946;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
  }

  header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    background: #FFFDF8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 21px;
    margin: 0;
    letter-spacing: 0.05em;
  }

  .filter-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-tab {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .filter-tab.active { background: var(--herb); border-color: var(--herb); color: #F5F0E5; }
  .filter-tab:hover:not(.active) { border-color: var(--herb); }

  .refresh-btn {
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--herb); color: var(--herb-deep); }

  .date-input {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink);
  }

  .summary-bar {
    display: none;
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 20px;
  }
  .summary-bar.show { display: block; }
  .summary-card {
    background: #FFFDF8;
    border: 1px solid var(--border);
    border-left: 4px solid var(--herb);
    border-radius: 6px;
    padding: 16px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .summary-card .label {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .summary-card .value {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--herb-deep);
  }
  .summary-card .value .count {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-left: 8px;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .order-card {
    background: #FFFDF8;
    border: 1px solid var(--border);
    border-left: 4px solid var(--gold);
    border-radius: 6px;
    padding: 16px 18px;
  }
  .order-card.st-待處理 { border-left-color: var(--gold); }
  .order-card.st-製作中 { border-left-color: var(--herb); border-left-width: 16px; }
  .order-card.st-已完成 { border-left-color: #A6A196; opacity: 0.7; }
  .order-card.st-已取消 { border-left-color: var(--seal); opacity: 0.55; }

  /* 製作中訂單超過 10 分鐘未完成時的提醒樣式 */
  .order-card.overdue {
    border-left-color: var(--alert-red);
    border-left-width: 16px;
    animation: overdue-pulse 1.6s ease-in-out infinite;
  }
  @keyframes overdue-pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(230, 57, 70, 0); }
    50% { box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.18); }
  }
  .overdue-badge {
    display: none;
    font-size: 11px;
    font-weight: 700;
    color: var(--alert-red);
    margin-bottom: 6px;
  }
  .order-card.overdue .overdue-badge { display: block; }

  .order-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .order-id {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 16px;
  }
  .order-time {
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .order-member {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .item-row {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    padding: 3px 0;
  }
  .item-row .qty {
    font-weight: 700;
    color: var(--herb-deep);
  }

  .order-total {
    text-align: right;
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 14px;
    margin: 8px 0 12px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .status-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .status-btn {
    flex: 1;
    min-width: 64px;
    font-size: 11.5px;
    font-weight: 700;
    padding: 7px 0;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .status-btn.current {
    background: var(--herb);
    border-color: var(--herb);
    color: #F5F0E5;
    cursor: default;
  }
  .status-btn:hover:not(.current) { border-color: var(--herb); color: var(--herb-deep); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-family: 'Noto Serif TC', serif;
    grid-column: 1 / -1;
  }

  .toast {
    position: fixed;
    top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: #F5F0E5;
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>廚房後台</h1>
  <div class="filter-tabs" id="filter-tabs"></div>
  <input type="date" class="date-input" id="date-filter">
  <button class="refresh-btn" onclick="clearDate()">清除日期</button>
  <button class="refresh-btn" onclick="load()">↻ 重新整理</button>
</header>

<div class="summary-bar" id="summary-bar">
  <div class="summary-card">
    <span class="label" id="summary-label">今日銷售總額</span>
    <span class="value" id="summary-value">NT$ 0<span class="count" id="summary-count"></span></span>
  </div>
</div>

<main>
  <div class="board" id="board"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const STATUSES = ['製作中', '已完成'];
let currentFilter = '製作中';
let orders = [];

function renderFilterTabs() {
  const el = document.getElementById('filter-tabs');
  const options = ['全部', ...STATUSES];
  el.innerHTML = options.map(s =>
    `<button class="filter-tab ${s === currentFilter ? 'active' : ''}" data-filter="${s}">${s}</button>`
  ).join('');
  el.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      renderFilterTabs();
      load();
    });
  });
}

async function load() {
  try {
    const params = new URLSearchParams();
    if (currentFilter !== '全部') params.set('status', currentFilter);
    const dateVal = document.getElementById('date-filter').value;
    if (dateVal) params.set('date', dateVal);

    const res = await fetch(`/api/orders?${params.toString()}`);
    orders = await res.json();
    render();
    renderSummary(dateVal);
  } catch {
    document.getElementById('board').innerHTML = '<div class="empty">讀取失敗，請確認伺服器是否正常運作</div>';
  }
}

function renderSummary(dateVal) {
  const bar = document.getElementById('summary-bar');

  const total = orders.reduce((sum, o) => sum + Number(o.total_amount), 0);
  const today = new Date().toISOString().slice(0, 10);
  const dayLabel = dateVal === today ? '今日' : (dateVal || '全部日期');
  const statusLabel = currentFilter === '全部' ? '' : `「${currentFilter}」`;
  const label = `${dayLabel} ${statusLabel}總金額`;

  document.getElementById('summary-label').textContent = label;
  document.getElementById('summary-value').innerHTML =
    `NT$ ${Math.round(total)}<span class="count">共 ${orders.length} 筆訂單</span>`;
  bar.classList.add('show');
}

function render() {
  const board = document.getElementById('board');

  if (orders.length === 0) {
    board.innerHTML = '<div class="empty">目前沒有符合條件的訂單</div>';
    return;
  }

  board.innerHTML = orders.map(o => `
    <div class="order-card st-${o.status}" data-status="${o.status}" data-created="${o.created_at}">
      <div class="overdue-badge">⚠ 已閒置超過 10 分鐘</div>
      <div class="order-top">
        <span class="order-id">#${o.id}</span>
        <span class="order-time">${formatTime(o.created_at)}</span>
      </div>
      <div class="order-member">
  ${o.customer_name}${o.member_phone ? `（${o.member_phone}）` : '（訪客）'}
</div>
      ${o.items.map(item => `
        <div class="item-row">
          <span>${item.dish_name}</span>
          <span class="qty">× ${item.quantity}</span>
        </div>
      `).join('')}
      <div class="order-total">NT$ ${Math.round(o.total_amount)}</div>
      <div class="status-row">
        ${STATUSES.map(s => `
          <button
            class="status-btn ${s === o.status ? 'current' : ''}"
            onclick="${s === o.status ? '' : `updateStatus(${o.id}, '${s}')`}"
          >${s}</button>
        `).join('')}
      </div>
    </div>
  `).join('');

  checkOverdue();
}

// 檢查每張「製作中」訂單卡片是否已超過 10 分鐘未完成，超過就加上 overdue 樣式（亮紅色提醒）
function checkOverdue() {
  const now = Date.now();
  document.querySelectorAll('.order-card').forEach(card => {
    const status = card.dataset.status;
    const created = new Date(card.dataset.created).getTime();
    const elapsedMinutes = (now - created) / 60000;
    const isOverdue = status === '製作中' && elapsedMinutes >= 10;
    card.classList.toggle('overdue', isOverdue);
  });
}

async function updateStatus(orderId, newStatus) {
  try {
    const res = await fetch(`/api/orders/${orderId}/status`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    if (!res.ok) throw new Error();
    showToast(`訂單 #${orderId} 已更新為「${newStatus}」`);
    await load();
  } catch {
    showToast('更新失敗，請確認伺服器是否正常運作');
  }
}

function clearDate() {
  document.getElementById('date-filter').value = '';
  load();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function formatTime(str) {
  const d = new Date(str);
  return d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

renderFilterTabs();
document.getElementById('date-filter').value = new Date().toISOString().slice(0, 10);
document.getElementById('date-filter').addEventListener('change', load);
load();
setInterval(checkOverdue, 15000);
</script>

</body>
</html>
